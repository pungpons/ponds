<script>
// Intercept fetch to mock the Apps Script backend using Google Sheets API
const ORIGINAL_FETCH = window.fetch;
window.fetch = async function(url, options) {
    if (typeof url === 'string' && url.includes('script.google.com')) {
        console.log("Intercepted GAS call:", options);
        try {
            const token = localStorage.getItem('pond_ai_token');
            if (!token) throw new Error("No Google Drive token. Please log in from main app.");
            
            const body = JSON.parse(options.body);
            const action = body.action;
            const FILE_NAME = 'UOB_Credit_Tracker_DB';
            
            // Helper to find file
            async function findFile() {
                const searchRes = await ORIGINAL_FETCH('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(`name='${FILE_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`), {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const searchData = await searchRes.json();
                return searchData.files && searchData.files.length > 0 ? searchData.files[0].id : null;
            }

            if (action === 'load') {
                const sheetId = await findFile();
                if (!sheetId) {
                    return new Response(JSON.stringify({ transactions: [], settings: {} }), { status: 200 });
                }
                
                // Fetch data from Google Sheets
                const sheetsUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchGet?ranges=Transactions!A2:H&ranges=Settings!A2:B`;
                const res = await ORIGINAL_FETCH(sheetsUrl, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                
                let transactions = [];
                let settings = {};
                
                if (data.valueRanges && data.valueRanges[0].values) {
                    transactions = data.valueRanges[0].values.map(row => ({
                        id: row[0] || "",
                        cardType: row[1] || "",
                        category: row[2] || "",
                        amount: Number(row[3]) || 0,
                        date: row[4] || "",
                        time: row[5] || "",
                        note: row[6] || "",
                        timestamp: row[7] ? Number(row[7]) : null
                    }));
                }
                
                if (data.valueRanges && data.valueRanges[1].values) {
                    data.valueRanges[1].values.forEach(row => {
                        settings[row[0]] = row[1];
                    });
                }
                
                let finalSettings = {
                    totalLimit: settings.totalLimit ? Number(settings.totalLimit) : 93000,
                    lowLimitThreshold: settings.lowLimitThreshold ? Number(settings.lowLimitThreshold) : 15000,
                    theme: settings.theme || 'auto'
                };
                
                return new Response(JSON.stringify({ transactions, settings: finalSettings }), { status: 200 });
            } 
            else if (action === 'save') {
                let sheetId = await findFile();
                
                if (!sheetId) {
                    // Create new spreadsheet if not exists
                    const createRes = await ORIGINAL_FETCH('https://sheets.googleapis.com/v4/spreadsheets', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            properties: { title: FILE_NAME },
                            sheets: [
                                { properties: { title: 'Transactions' } },
                                { properties: { title: 'Settings' } }
                            ]
                        })
                    });
                    const createData = await createRes.json();
                    sheetId = createData.spreadsheetId;
                    
                    // Add headers
                    await ORIGINAL_FETCH(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchUpdate`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            valueInputOption: 'USER_ENTERED',
                            data: [
                                { range: 'Transactions!A1:H1', values: [['ID', 'CardType', 'Category', 'Amount', 'Date', 'Time', 'Note', 'Timestamp']] },
                                { range: 'Settings!A1:B1', values: [['Key', 'Value']] }
                            ]
                        })
                    });
                }
                
                // Prepare rows
                let txRows = [];
                if (body.data.transactions) {
                    txRows = body.data.transactions.map(t => [
                        t.id, t.cardType, t.category, t.amount, 
                        "'" + (t.date || ""), "'" + (t.time || ""), 
                        t.note || "", t.timestamp || ""
                    ]);
                }
                
                let settingsRows = [
                    ["totalLimit", body.data.settings.totalLimit],
                    ["lowLimitThreshold", body.data.settings.lowLimitThreshold],
                    ["theme", body.data.settings.theme || "auto"]
                ];
                
                // Clear old data
                await ORIGINAL_FETCH(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchClear`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ranges: ['Transactions!A2:H', 'Settings!A2:B']
                    })
                });
                
                // Write new data
                if (txRows.length > 0 || settingsRows.length > 0) {
                    let updateData = [];
                    if (txRows.length > 0) updateData.push({ range: 'Transactions!A2', values: txRows });
                    if (settingsRows.length > 0) updateData.push({ range: 'Settings!A2', values: settingsRows });
                    
                    await ORIGINAL_FETCH(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchUpdate`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            valueInputOption: 'USER_ENTERED',
                            data: updateData
                        })
                    });
                }
                
                return new Response(JSON.stringify({ success: true }), { status: 200 });
            }
        } catch (e) {
            console.error(e);
            return new Response(JSON.stringify({ error: e.message, success: false }), { status: 200 });
        }
    }
    return ORIGINAL_FETCH(url, options);
};
</script>
