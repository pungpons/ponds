    <style>
/* ====== MOBILE COMPACT OVERRIDES ====== */
@media screen and (max-width: 768px) {

  /* 1. Shrink base font so all rem-based Tailwind sizes scale down ~20% */
  html { font-size: 13px !important; }

  /* 2. Short, flat inputs — 16px prevents iOS Safari zoom */
  input, select, textarea {
    font-size: 16px !important;
    height: 38px !important;
    max-height: 38px !important;
    padding-top: 4px !important;
    padding-bottom: 4px !important;
    line-height: 1.2 !important;
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    -webkit-appearance: none !important;
  }
  
  /* textareas can be taller */
  textarea {
    height: auto !important;
    max-height: none !important;
    min-height: 60px !important;
  }

  /* 3. Prevent ANY box from overflowing its parent */
  *, *::before, *::after {
    box-sizing: border-box !important;
    min-width: 0 !important;
    max-width: 100% !important;
  }

  /* 4. Tighten card padding */
  [class*="p-4"], [class*="p-5"], [class*="p-6"], [class*="p-8"],
  [class*="sm:p-8"], [class*="px-4"], [class*="px-5"], [class*="px-6"] {
    padding: 0.75rem !important;
  }

  /* 5. Shrink gaps and spacing */
  [class*="gap-4"], [class*="gap-5"], [class*="gap-6"] { gap: 0.6rem !important; }
  [class*="mb-5"], [class*="mb-6"] { margin-bottom: 0.6rem !important; }
  [class*="space-y-4"] > * + *, [class*="space-y-5"] > * + *, [class*="space-y-6"] > * + * {
    margin-top: 0.6rem !important;
  }

  /* 6. Tighten buttons */
  button {
    min-height: 38px !important;
    padding-top: 0.4rem !important;
    padding-bottom: 0.4rem !important;
  }
}
    
@media print {
    body, html, #root, #root > div, main {
        height: auto !important;
        min-height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        position: static !important;
        display: block !important;
    }
}

@media print {
    * {
        min-height: 0 !important;
        max-height: none !important;
    }
    body, html, #root, #root > div, main, #main-wrapper, .min-h-screen, .flex-1, .flex-col {
        height: auto !important;
        overflow: visible !important;
        position: static !important;
        display: block !important;
    }
    /* Hide non-printable stuff aggressively just in case */
    .no-print, nav, header {
        display: none !important;
    }
}
</style>
