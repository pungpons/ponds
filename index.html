    <!-- PONDs Smart Background Sync -->
    <script>
        // PONDs Smart Background Sync (V2 - Ultra Fast Headless Mode)
        window.addEventListener('load', () => {
            const token = localStorage.getItem('pond_ai_token');
            if (!token) return;

            setTimeout(() => {
                console.log('🔄 Starting Ultra-Fast Headless Sync...');
                
                // 1. Headless Network Sync (Zero CPU/DOM cost)
                // This finds all previously requested API URLs and quietly updates them in the background
                const keys = Object.keys(localStorage).filter(k => k.startsWith('gas_cache_'));
                
                // We stagger the headless requests by 2s to avoid slamming the network
                // NOTE: We MUST send the Authorization header so gas_backend.js can proxy it to GAS
                keys.forEach((key, index) => {
                    setTimeout(() => {
                        try {
                            const url = atob(key.replace('gas_cache_', ''));
                            // gas_backend.js intercepts this, serves from cache, and bgFetch refreshes in background
                            window.fetch(url, { headers: { Authorization: "Bearer " + token } }).catch(()=>{});
                        } catch(e) {}
                    }, index * 2000);
                });

                // 2. Iframe Fallback for New Devices (Only for apps that have NEVER been opened)
                // If the user has 0 cache keys, they are on a new device. We use the heavy iframe method.
                if (keys.length === 0) {
                    console.log('📱 New device detected, using Iframe Fallback Sync...');
                    const syncOrder = ['uob.html', 'asset.html', 'income.html', 'dollar.html', 'duty.html'];
                    let currentIndex = 0;
                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'absolute';
                    iframe.style.width = '1px';
                    iframe.style.height = '1px';
                    iframe.style.opacity = '0';
                    iframe.style.top = '-100px';
                    iframe.style.pointerEvents = 'none';
                    document.body.appendChild(iframe);

                    function syncNext() {
                        if (currentIndex >= syncOrder.length) {
                            setTimeout(() => { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 1000);
                            return;
                        }
                        iframe.src = syncOrder[currentIndex];
                        currentIndex++;
                        setTimeout(syncNext, 4000);
                    }
                    syncNext();
                } else {
                    console.log('✅ Headless Sync Queue Scheduled. (' + keys.length + ' endpoints)');
                }
                
            }, 2000); // Start slightly earlier since it's lightweight
        });
    </script>
